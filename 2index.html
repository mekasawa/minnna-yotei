<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福祉事業所版みんなの予定表</title>

<style>
body{
    font-family:sans-serif;
    margin:20px;
    background:#f3f6fa;
}

h1{
    color:#1976d2;
}

.card{
    background:white;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

input,select,button{
    padding:8px;
    margin:4px;
}

button{
    background:#1976d2;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
}

.day{
    background:white;
    border:1px solid #ddd;
    min-height:120px;
    padding:5px;
}

.dayNumber{
    font-weight:bold;
}

.event{
    color:white;
    padding:3px;
    margin-top:3px;
    border-radius:4px;
    font-size:12px;
}
</style>
</head>

<body>

<h1>福祉事業所版みんなの予定表</h1>

<div class="card">
<h2>利用者管理</h2>

<input id="userName" placeholder="利用者名">
<input id="userColor" type="color" value="#4caf50">
<button onclick="addUser()">追加</button>

<div id="userList"></div>
</div>

<div class="card">
<h2>予定テンプレート</h2>

<input id="templateName" placeholder="作業・通院など">
<button onclick="addTemplate()">追加</button>

<div id="templateList"></div>
</div>

<div class="card">
<h2>予定登録</h2>

<input id="eventDate" type="date">

<select id="userSelect"></select>

<select id="templateSelect"></select>

<br>

開始
<input id="startTime" type="time">

終了
<input id="endTime" type="time">

<br>

<input id="memo" placeholder="メモ">

<button onclick="addEvent()">登録</button>

</div>

<div class="card">

<button onclick="previousMonth()">前月</button>

<span id="monthTitle"></span>

<button onclick="nextMonth()">次月</button>

</div>

<div class="card">

<div id="calendar" class="calendar"></div>

</div>

<div class="card">

<h2>予定一覧</h2>

<div id="eventList"></div>

</div>

<div class="card">

<button onclick="exportCSV()">CSV出力</button>

</div>

<script>

let currentDate = new Date();

let users =
JSON.parse(localStorage.getItem("users") || "[]");

let templates =
JSON.parse(localStorage.getItem("templates") ||
'["作業","通院","休み"]');

let events =
JSON.parse(localStorage.getItem("events") || "[]");

function save(){

localStorage.setItem("users",
JSON.stringify(users));

localStorage.setItem("templates",
JSON.stringify(templates));

localStorage.setItem("events",
JSON.stringify(events));
}

function addUser(){

let name =
document.getElementById("userName").value;

let color =
document.getElementById("userColor").value;

if(!name) return;

users.push({
id: Date.now(),
name,
color
});

save();
render();
}

function addTemplate(){

let name =
document.getElementById("templateName").value;

if(!name) return;

templates.push(name);

save();
render();
}

function addEvent(){

let date =
document.getElementById("eventDate").value;

let userId =
document.getElementById("userSelect").value;

let title =
document.getElementById("templateSelect").value;

let start =
document.getElementById("startTime").value;

let end =
document.getElementById("endTime").value;

let memo =
document.getElementById("memo").value;

let user =
users.find(u => u.id == userId);

if(!user) return;

events.push({

id: Date.now(),

date,

userName: user.name,

title,

start,

end,

memo,

color: user.color

});

save();
render();
}

function renderUsers(){

let html = "";

users.forEach(user=>{

html += `
<div>${user.name}</div>
`;

});

document.getElementById(
"userList"
).innerHTML = html;

let select =
document.getElementById(
"userSelect"
);

select.innerHTML = "";

users.forEach(user=>{

select.innerHTML += `
<option value="${user.id}">
${user.name}
</option>
`;

});
}

function renderTemplates(){

let html = "";

templates.forEach(t=>{

html += `<div>${t}</div>`;

});

document.getElementById(
"templateList"
).innerHTML = html;

let select =
document.getElementById(
"templateSelect"
);

select.innerHTML = "";

templates.forEach(t=>{

select.innerHTML += `
<option>${t}</option>
`;

});
}

function renderEvents(){

let html = "";

events.forEach(event=>{

html += `
<div>

<b>${event.date}</b>

${event.start} ～ ${event.end}

<br>

${event.userName}

【${event.title}】

<br>

${event.memo}

<hr>

</div>
`;

});

document.getElementById(
"eventList"
).innerHTML = html;
}

function drawCalendar(){

const calendar =
document.getElementById(
"calendar"
);

calendar.innerHTML = "";

let year =
currentDate.getFullYear();

let month =
currentDate.getMonth();

document.getElementById(
"monthTitle"
).innerText =
`${year}年${month+1}月`;

let lastDay =
new Date(year,month+1,0).getDate();

for(let i=1;i<=lastDay;i++){

let dateStr =
`${year}-${String(month+1).padStart(2,"0")}-${String(i).padStart(2,"0")}`;

let day =
document.createElement("div");

day.className = "day";

let html =
`<div class="dayNumber">${i}</div>`;

events
.filter(e=>e.date===dateStr)
.forEach(e=>{

html += `
<div
class="event"
style="background:${e.color}"
>

${e.start}

<br>

${e.userName}

<br>

${e.title}

</div>
`;

});

day.innerHTML = html;

calendar.appendChild(day);
}
}

function previousMonth(){

currentDate.setMonth(
currentDate.getMonth()-1
);

drawCalendar();
}

function nextMonth(){

currentDate.setMonth(
currentDate.getMonth()+1
);

drawCalendar();
}

function exportCSV(){

let csv =
"日付,利用者,予定,開始,終了,メモ\n";

events.forEach(e=>{

csv +=
`${e.date},${e.userName},${e.title},${e.start},${e.end},${e.memo}\n`;

});

let blob =
new Blob([csv],{
type:"text/csv"
});

let a =
document.createElement("a");

a.href =
URL.createObjectURL(blob);

a.download =
"schedule.csv";

a.click();
}

function render(){

renderUsers();
renderTemplates();
renderEvents();
drawCalendar();
}

render();

</script>

</body>
</html>
